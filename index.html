<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Marca</title>
<style>
:root{--bg:#fff;--soft:#f3f5f9;--ink:#101828;--mut:#5b6575;--acc:#1d4ed8;--accink:#fff;--line:#e3e7ee}
@media (prefers-color-scheme:dark){:root{--bg:#0e1420;--soft:#151d2c;--ink:#eef1f6;--mut:#a0aabb;--acc:#6b95ff;--accink:#0e1420;--line:#243047}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.in{max-width:1080px;margin:0 auto;padding:76px 22px}
p{margin:0}
.f{white-space:pre-wrap}
/* cabecera */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.hin{max-width:1080px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;min-width:2ch}
.nav{display:flex;gap:18px;flex:1;flex-wrap:wrap;align-items:center}
.nl{color:var(--mut);text-decoration:none;font-size:.95rem}
.nl:hover{color:var(--ink)}
/* botones */
.lw{display:inline-block;margin:0 8px 0 0}
a.btn{display:inline-block;background:var(--acc);color:var(--accink);padding:.75em 1.5em;border-radius:8px;font-weight:600;text-decoration:none}
a.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
a.btn.sm{padding:.5em 1.1em;font-size:.92rem}
a.more{color:var(--acc);font-weight:600;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* secciones */
.s-hero .in{text-align:center;padding-top:88px}
.f-eyebrow{display:inline-block;background:var(--soft);color:var(--acc);font-weight:600;font-size:.9rem;padding:.3em .9em;border-radius:99px;margin-bottom:18px}
h1.f{font-size:clamp(2.3rem,6.5vw,4.2rem);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:0 auto 18px;max-width:16ch}
h2.f{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.12;letter-spacing:-.025em;font-weight:800;margin:0 0 12px}
h3.f{font-size:1.15rem;margin:0 0 6px;line-height:1.3}
.f-sub{color:var(--mut);font-size:1.15rem;max-width:56ch;margin:0 auto 26px}
.s-hero .im{margin:48px auto 0;max-width:900px}
.im{margin:0}
.im img{width:100%;display:block;border-radius:14px;border:1px solid var(--line)}
.ph{background:var(--soft);border:1px dashed var(--line);border-radius:14px;min-height:180px;display:grid;place-items:center;color:var(--mut)}
.s-steps,.s-showcase,.s-cta{background:var(--soft)}
.s-steps .f-sub,.s-features .f-sub{margin-left:0}
.list{display:grid;gap:18px;margin-top:34px;counter-reset:n}
.s-steps .list{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.s-steps .item{counter-increment:n}
.s-steps .item::before{content:counter(n,decimal-leading-zero);display:block;font-weight:800;font-size:1.9rem;color:var(--acc);margin-bottom:6px}
.s-features .list{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.s-features .item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:24px}
.s-features .item p{color:var(--mut);margin-bottom:10px}
.s-features .item .lw{margin-top:4px}
.item p{color:var(--mut)}
.s-showcase .in{display:grid;gap:44px;align-items:center}
@media (min-width:820px){.s-showcase .in{grid-template-columns:1fr 1fr}}
.s-showcase .tx p{color:var(--mut);margin-bottom:20px}
.s-faq .in{max-width:780px}
.s-faq .list{grid-template-columns:1fr;gap:0}
.s-faq .item{padding:20px 0;border-top:1px solid var(--line)}
.s-faq .item:last-child{border-bottom:1px solid var(--line)}
.s-cta .in{text-align:center}
.s-cta .f-text{color:var(--mut);max-width:52ch;margin:0 auto 24px;font-size:1.1rem}
.s-text .in{max-width:760px}
.s-text .f-text{color:var(--mut)}
footer .in{padding-top:40px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);display:flex;gap:18px 40px;flex-wrap:wrap;justify-content:space-between;color:var(--mut);font-size:.92rem}
footer a{color:var(--mut)}
.fl{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
/* edición */
body.editing{padding-top:54px}
body.editing .hdr{position:static}
.s,.item{position:relative}
.editing .s{outline:1px dashed var(--acc);outline-offset:-8px}
.editing .item{outline:1px dashed var(--line);outline-offset:6px}
[contenteditable]{outline:none;border-radius:4px;cursor:text}
[contenteditable]:hover{box-shadow:0 0 0 1px var(--line)}
[contenteditable]:focus{box-shadow:0 0 0 2px var(--acc)}
[contenteditable]:empty::before{content:attr(data-ph);opacity:.5}
.ctl{position:absolute;top:10px;right:10px;display:flex;gap:4px;align-items:center;z-index:3;font:13px system-ui,sans-serif}
.ctl .lab{background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:5px}
.ctl.sm{top:-14px;right:-6px}
.ctl button,.addsec button,.lw button,.imb button,#bar button,dialog button,.addsec select{font:13px system-ui,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 9px}
.lw button{padding:1px 5px;margin-left:2px;font-size:12px}
.imb{display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.addsec{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;font:13px system-ui,sans-serif;color:var(--mut);background:var(--bg);flex-wrap:wrap}
.list+button,.s .in>button{margin-top:18px;font:13px system-ui,sans-serif;cursor:pointer;border:1px dashed var(--acc);background:transparent;color:var(--acc);border-radius:6px;padding:6px 12px}
#bar{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--ink);color:var(--bg);font:14px system-ui,sans-serif;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0))}
#bar[hidden]{display:none}
#bar button{background:var(--acc);color:var(--accink);border:0;font-weight:600;padding:6px 12px}
#bar button.sec{background:transparent;border:1px solid currentColor;color:inherit}
dialog{max-width:440px;width:92%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
dialog label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
dialog input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink);font:15px system-ui,sans-serif}
#msg{color:#c0392b;min-height:1.3em;margin:8px 0 0}
</style>
</head>
<body>
<div id="bar" hidden>
  <span id="status">Modo edición</span>
  <span><button id="save">Publicar cambios</button> <button id="exit" class="sec">Salir</button></span>
</div>
<div id="app"></div>

<dialog id="login">
  <h3 style="margin-top:0">Acceso de administrador</h3>
  <p style="margin:0;color:var(--mut)">Los datos solo se guardan en este navegador. Pega el token que creaste en GitHub.</p>
  <label>Repositorio (usuario/nombre)<input id="repo" placeholder="tuusuario/mi-sitio"></label>
  <label>Rama<input id="branch" value="main"></label>
  <label>Token de GitHub<input id="token" type="password" autocomplete="off"></label>
  <p id="msg"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
    <button id="cancelLogin">Cancelar</button>
    <button id="doLogin" style="background:var(--acc);color:var(--accink);border:0">Entrar</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);

/* ---------- estructura de cada tipo de sección ---------- */
// t = texto de una línea, m = texto largo, b = botón/enlace, i = imagen
const SCH = {
  hero:{n:"Portada", f:[["eyebrow","t"],["title","t"],["sub","m"],["btn","b"],["btn2","b"],["img","i"]]},
  steps:{n:"Pasos numerados", f:[["title","t"],["sub","m"]], L:{k:"items",a:"paso",f:[["title","t"],["text","m"]]}},
  features:{n:"Tarjetas de funciones", f:[["title","t"],["sub","m"]], L:{k:"items",a:"tarjeta",f:[["title","t"],["text","m"],["link","b"]]}},
  showcase:{n:"Texto con imagen", f:[["title","t"],["text","m"],["btn","b"],["img","i"]]},
  faq:{n:"Preguntas frecuentes", f:[["title","t"]], L:{k:"items",a:"pregunta",f:[["q","t"],["a","m"]]}},
  cta:{n:"Llamado a la acción", f:[["title","t"],["text","m"],["btn","b"],["btn2","b"]]},
  text:{n:"Texto libre", f:[["title","t"],["text","m"]]}
};
const PH = {eyebrow:"Etiqueta", title:"Título", sub:"Subtítulo", text:"Texto", q:"Pregunta", a:"Respuesta"};

const DEFAULT = {
  brand:"Tu Marca",
  nav:[{text:"Qué hacemos",href:"#features"},{text:"Preguntas",href:"#faq"},{text:"Contacto",href:"#cta"}],
  hcta:{text:"Empezar",href:"#cta"},
  sections:[
    {type:"hero",eyebrow:"Escribe aquí tu frase corta",title:"Presenta tu proyecto de forma clara",sub:"Explica en dos líneas qué haces y para quién. Todo este texto se edita desde el panel de administrador.",btn:{text:"Empezar ahora",href:"#cta"},btn2:{text:"",href:""},img:""},
    {type:"steps",title:"Cómo trabajamos",sub:"Un proceso simple de principio a fin.",items:[
      {title:"Conocemos",text:"Entendemos lo que necesitas."},
      {title:"Planeamos",text:"Definimos objetivos y tiempos."},
      {title:"Creamos",text:"Hacemos el trabajo con calidad."},
      {title:"Medimos",text:"Revisamos resultados juntos."}]},
    {type:"features",title:"Lo que ofrecemos",sub:"Cada tarjeta se puede cambiar, mover o borrar.",items:[
      {title:"Servicio uno",text:"Describe aquí en qué consiste."},
      {title:"Servicio dos",text:"Describe aquí en qué consiste."},
      {title:"Servicio tres",text:"Describe aquí en qué consiste."}]},
    {type:"showcase",title:"Diseño a tu medida",text:"Cuenta aquí algo más a fondo. Puedes poner una imagen a la derecha desde el modo edición.",btn:{text:"Ver más",href:"#"},img:""},
    {type:"faq",title:"Preguntas cortas",items:[
      {q:"¿Cómo cambio este texto?",a:"Entra como administrador, haz clic en cualquier texto y escribe."},
      {q:"¿Puedo mover las secciones?",a:"Sí, con las flechas ↑ ↓ de cada sección."},
      {q:"¿Cuesta algo?",a:"Alojarlo en GitHub Pages es gratis."}]},
    {type:"cta",title:"Empieza hoy",text:"Escribe aquí una invitación a contactarte.",btn:{text:"Escríbenos",href:"mailto:tucorreo@ejemplo.com"},btn2:{text:"",href:""}}
  ],
  foot:"© Tu Marca. Todos los derechos reservados.",
  flinks:[{text:"Privacidad",href:"#"}]
};
let data = JSON.parse(JSON.stringify(DEFAULT));
let editing = false, dirty = false;
const cfgGet = () => { try { return JSON.parse(localStorage.getItem("cfg")) } catch { return null } };

/* ---------- utilidades ---------- */
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function btn(label, fn, title){ const b = el("button", null, label); b.type = "button"; if (title) b.title = title; b.onclick = fn; return b; }
function mv(arr, i, d){ const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; dirty = true; render(); }
const noEnter = e => { if (e.key === "Enter") e.preventDefault(); };
const plainPaste = e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); };

function txt(o, k, tag, multi, ph){
  if (!editing && !o[k]) return null;
  const e = el(tag, "f f-" + k); e.textContent = o[k] || "";
  if (editing){
    e.contentEditable = true; e.dataset.ph = ph || "Texto";
    e.oninput = () => { o[k] = multi ? e.innerText : e.innerText.replace(/\n/g, " "); dirty = true; };
    if (!multi) e.onkeydown = noEnter;
    e.onpaste = plainPaste;
  }
  return e;
}
function lnk(o, k, cls){
  if (!editing && !(o[k] && o[k].text)) return null;
  if (!o[k]) o[k] = {text:"", href:""};
  const v = o[k], w = el("span", "lw"), a = el("a", cls);
  a.textContent = v.text || ""; a.href = editing ? "#" : (v.href || "#");
  if (editing){
    a.contentEditable = true; a.dataset.ph = "Texto del botón";
    a.onclick = e => e.preventDefault(); a.onkeydown = noEnter; a.onpaste = plainPaste;
    a.oninput = () => { v.text = a.innerText.replace(/\n/g, " "); dirty = true; };
    w.append(a, btn("🔗", () => {
      const h = prompt("Dirección del enlace (https://…, mailto:… o #seccion)", v.href || "");
      if (h !== null){ v.href = h.trim(); dirty = true; setStatus("Enlace cambiado: " + (v.href || "(vacío)")); }
    }, "Cambiar enlace"));
  } else w.appendChild(a);
  return w;
}
function img(o, k){
  const url = o[k + "_p"] || o[k];
  if (!editing){ if (!url) return null; const i = el("img", "im"); i.src = url; i.alt = ""; i.loading = "lazy"; return i; }
  const f = el("figure", "im");
  if (url){ const i = el("img"); i.src = url; f.appendChild(i); } else f.appendChild(el("div", "ph", "Sin imagen"));
  const up = el("input"); up.type = "file"; up.accept = "image/*"; up.hidden = true; up.onchange = () => uploadImage(up.files[0], o, k);
  const bar = el("div", "imb");
  bar.append(btn("Subir foto", () => up.click()), btn("Usar dirección", () => {
    const u = prompt("Dirección de la imagen (https://…)", o[k] || "");
    if (u !== null){ o[k] = u.trim(); o[k + "_p"] = null; dirty = true; render(); }
  }), up);
  if (o[k]) bar.append(btn("Quitar", () => { o[k] = ""; o[k + "_p"] = null; dirty = true; render(); }));
  f.appendChild(bar); return f;
}
function fields(o, defs, type, item){
  const out = [];
  defs.forEach(([k, kind]) => {
    let e;
    if (kind === "b") e = lnk(o, k, {btn:"btn", btn2:"btn ghost", link:"more"}[k] || "btn");
    else if (kind === "i") e = img(o, k);
    else { const h = k === "title" || k === "q"; e = txt(o, k, h ? (item ? "h3" : type === "hero" ? "h1" : "h2") : "p", kind === "m", PH[k]); }
    if (e) out.push(e);
  });
  return out;
}
function blank(defs){
  const o = {};
  defs.forEach(([k, kind]) => o[k] = kind === "b" ? {text:"Ver más", href:""} : kind === "i" ? "" : kind === "m" ? "Escribe aquí tu texto." : "Nuevo título");
  return o;
}
function newSec(type){
  const d = SCH[type], s = {type, ...blank(d.f)};
  if (d.L) s[d.L.k] = [blank(d.L.f), blank(d.L.f), blank(d.L.f)];
  return s;
}

/* ---------- dibujar ---------- */
function linkList(arr, cls, wrapCls){
  const w = el("div", wrapCls);
  arr.forEach((l, j) => {
    const e = lnk(arr, j, cls); if (!e) return;
    if (editing) e.appendChild(btn("✕", () => { arr.splice(j, 1); dirty = true; render(); }, "Quitar"));
    w.appendChild(e);
  });
  if (editing) w.appendChild(btn("+ enlace", () => { arr.push({text:"Enlace", href:"#"}); dirty = true; render(); }));
  return w;
}
function header(){
  const h = el("header", "hdr"), b = el("div", "hin");
  const brand = txt(data, "brand", "div", false, "Nombre") || el("div");
  brand.classList.add("brand");
  b.append(brand, linkList(data.nav, "nl", "nav"));
  const c = lnk(data, "hcta", "btn sm"); if (c) b.appendChild(c);
  h.appendChild(b); return h;
}
function sec(s, i, ids){
  const d = SCH[s.type]; if (!d) return el("div");
  const w = el("section", "s s-" + s.type), inn = el("div", "in"); w.appendChild(inn);
  if (!ids[s.type]){ w.id = s.type; ids[s.type] = 1; }
  const els = fields(s, d.f, s.type, false), tx = el("div", "tx");
  const imgs = els.filter(e => e.classList.contains("im"));
  els.filter(e => !e.classList.contains("im")).forEach(e => tx.appendChild(e));
  inn.appendChild(tx); imgs.forEach(e => inn.appendChild(e));
  if (d.L){
    const arr = s[d.L.k], L = el("div", "list");
    arr.forEach((it, j) => {
      const c = el("div", "item"); fields(it, d.L.f, s.type, true).forEach(e => c.appendChild(e));
      if (editing){
        const ct = el("div", "ctl sm");
        ct.append(btn("◀", () => mv(arr, j, -1), "Mover atrás"), btn("▶", () => mv(arr, j, 1), "Mover adelante"),
          btn("✕", () => { arr.splice(j, 1); dirty = true; render(); }, "Borrar"));
        c.appendChild(ct);
      }
      L.appendChild(c);
    });
    inn.appendChild(L);
    if (editing) inn.appendChild(btn("+ Añadir " + d.L.a, () => { arr.push(blank(d.L.f)); dirty = true; render(); }));
  }
  if (editing){
    const ct = el("div", "ctl");
    ct.append(el("span", "lab", d.n), btn("↑", () => mv(data.sections, i, -1), "Subir sección"), btn("↓", () => mv(data.sections, i, 1), "Bajar sección"),
      btn("✕", () => { if (confirm("¿Borrar esta sección completa?")){ data.sections.splice(i, 1); dirty = true; render(); } }, "Borrar sección"));
    w.appendChild(ct);
  }
  return w;
}
function addSec(at){
  const d = el("div", "addsec"), sel = el("select");
  Object.entries(SCH).forEach(([k, v]) => { const o = el("option", null, v.n); o.value = k; sel.appendChild(o); });
  d.append(el("span", null, "Añadir sección:"), sel, btn("Añadir", () => { data.sections.splice(at, 0, newSec(sel.value)); dirty = true; render(); }));
  return d;
}
function footer(){
  const f = el("footer"), b = el("div", "in"); f.appendChild(b);
  const t = txt(data, "foot", "p", true, "Texto del pie de página") || el("p");
  const r = el("div", "fl"); r.appendChild(linkList(data.flinks, "nl", "fl"));
  const a = el("a", null, "Administrar"); a.href = "#admin"; a.onclick = e => { e.preventDefault(); cfgGet() ? startEdit() : openLogin(); };
  r.appendChild(a); b.append(t, r); return f;
}
function render(){
  const y = scrollY, app = $("#app"), ids = {};
  app.innerHTML = ""; app.appendChild(header());
  const m = el("main");
  data.sections.forEach((s, i) => { if (editing) m.appendChild(addSec(i)); m.appendChild(sec(s, i, ids)); });
  if (editing) m.appendChild(addSec(data.sections.length));
  app.append(m, footer());
  document.body.classList.toggle("editing", editing); $("#bar").hidden = !editing;
  document.title = data.brand || "Mi sitio";
  scrollTo(0, y);
}

/* ---------- GitHub ---------- */
const b64 = s => btoa(unescape(encodeURIComponent(s)));
async function gh(path, opts = {}){
  const c = cfgGet();
  return fetch("https://api.github.com/repos/" + c.repo + path, {...opts, headers:{
    Authorization:"Bearer " + c.token, Accept:"application/vnd.github+json", "Content-Type":"application/json"}});
}
async function put(path, contentB64, message){
  const c = cfgGet(); let sha;
  const g = await gh("/contents/" + path + "?ref=" + encodeURIComponent(c.branch));
  if (g.ok) sha = (await g.json()).sha;
  const r = await gh("/contents/" + path, {method:"PUT", body:JSON.stringify({message, content:contentB64, branch:c.branch, sha})});
  if (!r.ok) throw new Error((await r.json()).message || r.status);
}
function setStatus(t){ $("#status").textContent = t; }
$("#save").onclick = async () => {
  setStatus("Guardando…");
  try{
    const json = JSON.stringify(data, (k, v) => String(k).endsWith("_p") ? undefined : v, 2);
    await put("content.json", b64(json), "Actualizar contenido desde el editor");
    dirty = false; setStatus("Publicado. Se verá en el sitio en 1 o 2 minutos.");
  }catch(e){ setStatus("Error al guardar: " + e.message); }
};
function uploadImage(file, o, k){
  if (!file) return;
  setStatus("Subiendo imagen…");
  const rd = new FileReader();
  rd.onload = async () => {
    try{
      const name = "images/" + Date.now() + "-" + file.name.replace(/[^\w.\-]/g, "_");
      await put(name, rd.result.split(",")[1], "Subir imagen");
      o[k] = name; o[k + "_p"] = rd.result; dirty = true; render();
      setStatus("Imagen subida. Pulsa Publicar cambios para guardar.");
    }catch(e){ setStatus("Error al subir: " + e.message); }
  };
  rd.readAsDataURL(file);
}

/* ---------- acceso ---------- */
function guess(){
  const h = location.hostname, p = location.pathname.split("/")[1];
  return h.endsWith(".github.io") ? h.split(".")[0] + "/" + (p || h) : "";
}
function startEdit(){ editing = true; setStatus("Modo edición: haz clic en cualquier texto"); render(); scrollTo(0, 0); }
function openLogin(){
  const c = cfgGet() || {};
  $("#repo").value = c.repo || guess(); $("#branch").value = c.branch || "main"; $("#token").value = c.token || "";
  $("#msg").textContent = ""; $("#login").showModal();
}
$("#cancelLogin").onclick = () => $("#login").close();
$("#doLogin").onclick = async () => {
  const c = {repo:$("#repo").value.trim(), branch:$("#branch").value.trim() || "main", token:$("#token").value.trim()};
  $("#msg").textContent = "Comprobando…";
  try{
    localStorage.setItem("cfg", JSON.stringify(c));
    const r = await gh(""), j = await r.json();
    if (!r.ok) throw new Error(j.message);
    if (!j.permissions || !j.permissions.push) throw new Error("El token no tiene permiso de escritura en este repositorio.");
    $("#login").close(); startEdit();
  }catch(e){ localStorage.removeItem("cfg"); $("#msg").textContent = "No se pudo entrar: " + e.message; }
};
$("#exit").onclick = () => {
  if (dirty && !confirm("Tienes cambios sin publicar. ¿Salir de todos modos?")) return;
  if (confirm("¿Cerrar la sesión de administrador en este navegador?")) localStorage.removeItem("cfg");
  editing = false; dirty = false; load();
};
addEventListener("beforeunload", e => { if (editing && dirty){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- cargar ---------- */
async function load(){
  try{
    const r = await fetch("content.json?v=" + Date.now());
    if (r.ok){ const j = await r.json(); if (j && Array.isArray(j.sections)) data = {...DEFAULT, ...j}; }
  }catch(e){}
  render();
}
load().then(() => { if (location.hash === "#admin") (cfgGet() ? startEdit() : openLogin()); });
</script>
</body>
